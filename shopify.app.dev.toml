# Local development config (Cloudflare tunnel / shopify app dev)
# Usage: npm run dev  (uses this file via --config)
# Never deploy this file to production.

name = "CorePilot AI"
client_id = "a4ba88c8d3f3c2c642fb0791258c1142"
application_url = "https://corepilotai.corewital.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "corewitalapp.myshopify.com"

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_orders,read_customers,read_content,write_content,read_themes,write_themes,read_online_store_navigation,write_files"

[auth]
redirect_urls = [
  "https://corepilotai.corewital.com/auth/callback",
  "https://corepilotai.corewital.com/auth/shopify/callback",
  "https://corepilotai.corewital.com/api/auth/callback"
]

[app_preferences]
url = "https://corepilotai.corewital.com/app/settings/general"

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "products/create" ]
  uri = "/webhooks/products/create"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  # Mandatory App Store compliance (GDPR) — all three required
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"
